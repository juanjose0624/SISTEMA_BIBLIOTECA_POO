<!-- FORMULARIO -->
<section class="container my-5">
    <h2 class="text-center mb-4">Registro de Usuario</h2>

    <form id="formRegistro" class="row g-3">

        <!-- Nombre -->
        <div class="col-md-6">
            <input type="text" name="nombre" class="form-control"
                   placeholder="Nombre completo"
                   pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ ]+"
                   title="Solo letras"
                   required>
        </div>

        <!-- Apellido -->
        <div class="col-md-6">
            <input type="text" name="apellido" class="form-control"
                   placeholder="Apellidos"
                   pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ ]+"
                   title="Solo letras"
                   required>
        </div>

        <!-- Edad -->
        <div class="col-md-4">
            <input type="number" name="edad" class="form-control"
                   placeholder="Edad"
                   min="15" max="100"
                   required>
        </div>

        <!-- Tipo documento -->
        <div class="col-md-4">
            <select name="tipo_doc" class="form-control" required>
                <option value="">Tipo de documento</option>
                <option value="CC">Cédula</option>
                <option value="TI">Tarjeta de Identidad</option>
                <option value="CE">Cédula Extranjera</option>
            </select>
        </div>

        <!-- Número documento -->
        <div class="col-md-4">
            <input type="text" name="num_doc" class="form-control"
                   placeholder="Número de documento"
                   pattern="[0-9]+"
                   title="Solo números"
                   required>
        </div>

        <!-- Celular -->
        <div class="col-md-6">
            <input type="text" name="celular" class="form-control"
                   placeholder="Celular"
                   pattern="[0-9]{10}"
                   title="Debe tener 10 dígitos"
                   required>
        </div>

        <!-- Correo -->
        <div class="col-md-6">
            <input type="email" name="correo" class="form-control"
                   placeholder="Correo electrónico"
                   required>
        </div>

        <!-- Contraseña -->
        <div class="col-md-12">
            <input type="password" name="password" class="form-control"
                   placeholder="Contraseña"
                   minlength="6"
                   required>
        </div>

        <!-- Botón -->
        <div class="col-12 text-center">
            <button type="submit" class="btn btn-success px-5">Registrarse</button>
        </div>

    </form>
</section>
